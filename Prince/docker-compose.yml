services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - prince-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ./Backend
      dockerfile: Core/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      file-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  checkout-api:
    build:
      context: ./Backend
      dockerfile: Checkout/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  jobs-api:
    build:
      context: ./Backend
      dockerfile: Jobs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JobsAdmin__Email: ${JOBS_ADMIN_EMAIL}
      JobsAdmin__Password: ${JOBS_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-storage:
    # Silo: a maintained MinIO fork (MinIO's own images are no longer published); same S3 API and MINIO_* settings
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${FILE_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FILE_STORAGE_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    # The services reach the S3 API (9000) on the Compose network, so it isn't published. The console is, on this
    # machine only.
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - prince-filestorage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  file-storage-init:
    # Same image as the server: its bundled client (mcli) creates the bucket
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    entrypoint: >
      /bin/sh -c "
      mcli alias set local http://file-storage:9000 ${FILE_STORAGE_ROOT_USER} ${FILE_STORAGE_ROOT_PASSWORD} &&
      mcli mb --ignore-existing local/${FILE_STORAGE_BUCKET}
      "
    depends_on:
      file-storage:
        condition: service_healthy

  core-web-vue:
    build:
      context: ./Frontend/prince-core-vue
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  checkout-web-vue:
    build:
      context: ./Frontend/prince-checkout-vue
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-web-react:
    build:
      context: ./Frontend/prince-core-react
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  checkout-web-react:
    build:
      context: ./Frontend/prince-checkout-react
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverse-proxy:
    build:
      context: ./reverse-proxy
    ports:
      - "127.0.0.1:${REVERSE_PROXY_PORT}:80"
    depends_on:
      core-api:
        condition: service_healthy
      checkout-api:
        condition: service_healthy
      jobs-api:
        condition: service_healthy
      core-web-vue:
        condition: service_healthy
      checkout-web-vue:
        condition: service_healthy
      core-web-react:
        condition: service_healthy
      checkout-web-react:
        condition: service_healthy

volumes:
  prince-pgdata:
  prince-filestorage-data:
