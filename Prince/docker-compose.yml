services:
  env-check:
    # Validates the .env values that would otherwise fail quietly (a short Silo password, a Jobs admin password
    # that breaks ASP.NET Identity's policy) and prints which one is wrong and why, never the value. Runs once;
    # the services using those values wait for it. The script is a file so it can be tested without Docker.
    image: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
    command: ["/bin/sh", "/env-check.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      JOBS_ADMIN_EMAIL: ${JOBS_ADMIN_EMAIL:-}
      JOBS_ADMIN_PASSWORD: ${JOBS_ADMIN_PASSWORD:-}
      FILE_STORAGE_ROOT_USER: ${FILE_STORAGE_ROOT_USER:-}
      FILE_STORAGE_ROOT_PASSWORD: ${FILE_STORAGE_ROOT_PASSWORD:-}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-}
    volumes:
      - ./env-check.sh:/env-check.sh:ro
    network_mode: none
    read_only: true
    user: "65534:65534"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prince-pgdata:/var/lib/postgresql/data
    depends_on:
      env-check:
        condition: service_completed_successfully
    healthcheck:
      # "healthy" means the server accepts connections and the application database answers select 1; it does not
      # mean the services have migrated (that is their own /health). The password is never part of the command:
      # local socket connections inside the container need none.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" && psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  core-api:
    build:
      context: ./Backend
      dockerfile: Core/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Passes when /health answers and postgres:5432 accepts a TCP connection (bash's /dev/tcp: a bare connect that
      # sends nothing; the image's sh is dash, which has no /dev/tcp), so a backend turns unhealthy during a Postgres
      # outage. It cannot see a missing application
      # database or a migration still running: that is the /ready endpoint of the Prince design sprint. Both calls
      # stay inside the 3 s timeout; the failures of the first 30 s are not counted, and the check runs every 2 s
      # until the first success.
      test: ["CMD-SHELL", "curl -fs -m 2 -o /dev/null http://localhost:8080/health && bash -c 'exec 3<>/dev/tcp/postgres/5432'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  checkout-api:
    build:
      context: ./Backend
      dockerfile: Checkout/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Passes when /health answers and postgres:5432 accepts a TCP connection (bash's /dev/tcp: a bare connect that
      # sends nothing; the image's sh is dash, which has no /dev/tcp), so a backend turns unhealthy during a Postgres
      # outage. It cannot see a missing application
      # database or a migration still running: that is the /ready endpoint of the Prince design sprint. Both calls
      # stay inside the 3 s timeout; the failures of the first 30 s are not counted, and the check runs every 2 s
      # until the first success.
      test: ["CMD-SHELL", "curl -fs -m 2 -o /dev/null http://localhost:8080/health && bash -c 'exec 3<>/dev/tcp/postgres/5432'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  jobs-api:
    build:
      context: ./Backend
      dockerfile: Jobs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JobsAdmin__Email: ${JOBS_ADMIN_EMAIL}
      JobsAdmin__Password: ${JOBS_ADMIN_PASSWORD}
    depends_on:
      env-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      # Passes when /health answers and postgres:5432 accepts a TCP connection (bash's /dev/tcp: a bare connect that
      # sends nothing; the image's sh is dash, which has no /dev/tcp), so a backend turns unhealthy during a Postgres
      # outage. It cannot see a missing application
      # database or a migration still running: that is the /ready endpoint of the Prince design sprint. Both calls
      # stay inside the 3 s timeout; the failures of the first 30 s are not counted, and the check runs every 2 s
      # until the first success.
      test: ["CMD-SHELL", "curl -fs -m 2 -o /dev/null http://localhost:8080/health && bash -c 'exec 3<>/dev/tcp/postgres/5432'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 2s
    restart: unless-stopped

  file-storage:
    # Silo: a maintained MinIO fork (MinIO's own images are no longer published); same S3 API and MINIO_* settings
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z
    environment:
      MINIO_ROOT_USER: ${FILE_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FILE_STORAGE_ROOT_PASSWORD}
      # read by the entrypoint wrapper and the health check, which hand them to mcli through the environment
      FILE_STORAGE_ROOT_USER: ${FILE_STORAGE_ROOT_USER}
      FILE_STORAGE_ROOT_PASSWORD: ${FILE_STORAGE_ROOT_PASSWORD}
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET}
    # The wrapper starts the server and creates the bucket (idempotently) with the image's bundled client
    entrypoint: ["/bin/bash", "/file-storage-entrypoint.sh"]
    command: server /data --console-address ":9001"
    # The services reach the S3 API (9000) on the Compose network, so it isn't published. The console is, on this
    # machine only.
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - prince-filestorage-data:/data
      - ./file-storage-entrypoint.sh:/file-storage-entrypoint.sh:ro
    depends_on:
      env-check:
        condition: service_completed_successfully
    healthcheck:
      # Healthy only once the server answers and the bucket exists; whatever needs the bucket waits for
      # `file-storage: service_healthy`. The credentials come from the environment ("$$VAR"), never from the command.
      test: ["CMD-SHELL", "curl -fs -m 3 -o /dev/null http://localhost:9000/minio/health/live && MC_HOST_local=\"http://$$FILE_STORAGE_ROOT_USER:$$FILE_STORAGE_ROOT_PASSWORD@127.0.0.1:9000\" mcli stat \"local/$$FILE_STORAGE_BUCKET\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  core-web-vue:
    build:
      context: ./Frontend/prince-core-vue
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  checkout-web-vue:
    build:
      context: ./Frontend/prince-checkout-vue
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  core-web-react:
    build:
      context: ./Frontend/prince-core-react
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  checkout-web-react:
    build:
      context: ./Frontend/prince-checkout-react
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  reverse-proxy:
    build:
      context: ./reverse-proxy
    # Compose service names resolve through Docker's embedded DNS (127.0.0.11); every other name fails at once instead of
    # being forwarded to the host's resolver (and its LLMNR lookups on the local network).
    dns:
      - 127.0.0.1
    # No host port: the edge proxy (Edge/) is the only thing that publishes one. This proxy joins its network under the
    # alias the edge routes the production hostname to, and keeps the stack's own network for its backends.
    networks:
      default: {}
      elysium-edge:
        aliases:
          - prince-prod-proxy
    # The proxy starts without its backends (it looks them up when a request comes), so its check only asks whether nginx
    # answers at all: any HTTP status counts, a 404 included.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -S --spider -T 2 http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

networks:
  # Created by Edge/docker-compose.yml, which starts first; without it `up` stops and names this network
  elysium-edge:
    external: true
    name: elysium-edge

volumes:
  prince-pgdata:
  prince-filestorage-data:
