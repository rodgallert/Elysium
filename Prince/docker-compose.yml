services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - prince-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ./Backend
      dockerfile: Core/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      file-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  checkout-api:
    build:
      context: ./Backend
      dockerfile: Checkout/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  jobs-api:
    build:
      context: ./Backend
      dockerfile: Jobs/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Prince: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      JobsAdmin__Email: ${JOBS_ADMIN_EMAIL}
      JobsAdmin__Password: ${JOBS_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  file-storage:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${FILE_STORAGE_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${FILE_STORAGE_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prince-filestorage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  file-storage-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://file-storage:9000 ${FILE_STORAGE_ROOT_USER} ${FILE_STORAGE_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${FILE_STORAGE_BUCKET}
      "
    depends_on:
      file-storage:
        condition: service_healthy

  core-web:
    build:
      context: ./Frontend/prince-core

  checkout-web:
    build:
      context: ./Frontend/prince-checkout

  reverse-proxy:
    build:
      context: ./reverse-proxy
    ports:
      - "${REVERSE_PROXY_PORT}:80"
    depends_on:
      core-api:
        condition: service_healthy
      checkout-api:
        condition: service_healthy
      jobs-api:
        condition: service_healthy
      core-web:
        condition: service_started
      checkout-web:
        condition: service_started

volumes:
  prince-pgdata:
  prince-filestorage-data:
