user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream core_api {
        server core-api:8080;
    }

    upstream checkout_api {
        server checkout-api:8080;
    }

    upstream jobs_api {
        server jobs-api:8080;
    }

    upstream core_web_vue {
        server core-web-vue:80;
    }

    upstream checkout_web_vue {
        server checkout-web-vue:80;
    }

    upstream core_web_react {
        server core-web-react:80;
    }

    upstream checkout_web_react {
        server checkout-web-react:80;
    }

    server {
        listen 80;

        # The proxy is published on a non-80 host port (REVERSE_PROXY_PORT), so nginx's own
        # trailing-slash redirects (/vue -> /vue/) must be relative — absolute ones would be
        # built from `listen 80` and drop the real port. Likewise Host is forwarded as
        # $http_host (keeps the port) so upstream-generated redirects (e.g. Jobs' login) work.
        absolute_redirect off;

        # Vue checkout web app — built with base '/vue/checkout/', so both the app shell and its
        # asset requests arrive here; prefix is stripped before forwarding to the container root.
        location /vue/checkout/ {
            proxy_pass http://checkout_web_vue/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vue core web app — built with base '/vue/', same prefix-stripping as above.
        location /vue/ {
            proxy_pass http://core_web_vue/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React checkout web app — built with base '/react/checkout/'.
        location /react/checkout/ {
            proxy_pass http://checkout_web_react/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React core web app — built with base '/react/'.
        location /react/ {
            proxy_pass http://core_web_react/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Checkout API — declared before the core /api/ catch-all so it isn't swallowed by it.
        location /api/checkout/ {
            proxy_pass http://checkout_api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://core_api/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /jobs externally maps to the Hangfire dashboard, mounted at /hangfire internally.
        location /jobs/ {
            proxy_pass http://jobs_api/hangfire/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Jobs' admin login/logout — same path on both sides, no rewrite.
        location /admin/ {
            proxy_pass http://jobs_api/admin/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NOTE: nothing serves "/" anymore now that core web moved to /vue — decide whether
        # this should redirect somewhere (e.g. to /vue/) or stay a 404.
    }
}
