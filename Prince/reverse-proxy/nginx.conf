user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Backends are looked up by name at request time, through Docker's embedded DNS (127.0.0.11, which every
    # user-defined network, so every Compose project network, provides). A recreated container gets a new address
    # and nginx finds it within `valid` seconds, without a restart; a backend that is down or not created yet
    # answers 502 and does not stop nginx from starting. ipv6=off: a missing or failing AAAA answer can't fail a
    # request. A failed lookup is logged with the backend's name ("<name> could not be resolved").
    # Because every proxy_pass below takes a variable, nginx no longer strips the matched prefix itself: each
    # location rewrites the (decoded, normalised) path to what the backend receives, as it did before.
    # nginx 1.29.7 changed the default of proxy_http_version to 1.1; the backends keep receiving HTTP/1.0 as before.
    proxy_http_version 1.0;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # The proxy is published on a non-80 host port (REVERSE_PROXY_PORT), so nginx's own
        # trailing-slash redirects (/vue -> /vue/) must be relative — absolute ones would be
        # built from `listen 80` and drop the real port. Likewise Host is forwarded as
        # $http_host (keeps the port) so upstream-generated redirects (e.g. Jobs' login) work.
        absolute_redirect off;

        # Vue checkout web app — built with base '/vue/checkout/', so both the app shell and its
        # asset requests arrive here; prefix is stripped before forwarding to the container root.
        location /vue/checkout/ {
            set $backend http://checkout-web-vue:80;
            rewrite ^/vue/checkout/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Vue core web app — built with base '/vue/', same prefix-stripping as above.
        location /vue/ {
            set $backend http://core-web-vue:80;
            rewrite ^/vue/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React checkout web app — built with base '/react/checkout/'.
        location /react/checkout/ {
            set $backend http://checkout-web-react:80;
            rewrite ^/react/checkout/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # React core web app — built with base '/react/'.
        location /react/ {
            set $backend http://core-web-react:80;
            rewrite ^/react/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Checkout API — declared before the core /api/ catch-all so it isn't swallowed by it.
        location /api/checkout/ {
            set $backend http://checkout-api:8080;
            rewrite ^/api/checkout/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            set $backend http://core-api:8080;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /jobs externally maps to the Hangfire dashboard, mounted at /hangfire internally.
        location /jobs/ {
            set $backend http://jobs-api:8080;
            rewrite ^/jobs/(.*)$ /hangfire/$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Jobs' admin login/logout — same path on both sides, no rewrite.
        location /admin/ {
            set $backend http://jobs-api:8080;
            rewrite ^/admin/(.*)$ /admin/$1 break;
            proxy_pass $backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NOTE: nothing serves "/" anymore now that core web moved to /vue — decide whether
        # this should redirect somewhere (e.g. to /vue/) or stay a 404.
    }
}
