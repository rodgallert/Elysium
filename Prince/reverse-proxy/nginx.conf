user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream core_api {
        server core-api:8080;
    }

    upstream checkout_api {
        server checkout-api:8080;
    }

    upstream jobs_api {
        server jobs-api:8080;
    }

    upstream core_web {
        server core-web:80;
    }

    upstream checkout_web {
        server checkout-web:80;
    }

    server {
        listen 80;

        # Checkout web app — built with base '/checkout/', so both the app shell and its
        # asset requests arrive here; prefix is stripped before forwarding to the container root.
        location /checkout/ {
            proxy_pass http://checkout_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Checkout API — declared before the core /api/ catch-all so it isn't swallowed by it.
        location /api/checkout/ {
            proxy_pass http://checkout_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://core_api/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /jobs externally maps to the Hangfire dashboard, mounted at /hangfire internally.
        location /jobs/ {
            proxy_pass http://jobs_api/hangfire/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Jobs' admin login/logout — same path on both sides, no rewrite.
        location /admin/ {
            proxy_pass http://jobs_api/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Core web app — catch-all, must stay last so it doesn't swallow the more specific routes above.
        location / {
            proxy_pass http://core_web/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
