# Builds and tests every .NET solution and every frontend in the repository, and checks the service boundaries.
# On a push to main, once all of that passes, it also publishes the development images (see the publish job).
# The `gate` job is the one check main and release/** require (Docs/workflow.md, "Required check"): it reports on every
# change, Markdown-only ones included, and covers this workflow's jobs and the Release workflow's pull request run.
name: Build

# One build per change: pushes build only main and release branches, every other branch builds through its pull request.
# Changes that only touch Markdown (docs, notes) skip the build jobs (the `changes` job decides, not a paths filter, so
# the workflow still runs and the gate still reports).
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Check the production pins as for a release PR (the release workflow's prepare run sets it)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main and release branches always finish.
# On main this also keeps publishes in merge order: one run at a time, and a newer merge replaces a queued one,
# so :main never moves back to an older commit.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does the change touch anything besides Markdown? A pull request is judged against its base, a push against the
  # commit before it (a new branch or an unknown commit counts as code), a manual run always builds.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            # The checkout is the PR's merge commit: HEAD^1 is the base, HEAD what the merge will be
            pull_request) code="$(tools/ci-code-changed.sh HEAD^1)" ;;
            push) code="$(tools/ci-code-changed.sh "$BEFORE")" ;;
            *) code=true ;;
          esac
          echo "Code changed: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  boundaries:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check the service boundaries
        run: tools/check-boundaries.sh

  dotnet:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Every solution builds on its own, since services don't share a solution
      - name: Build and test every solution
        run: |
          mapfile -t solutions < <(find . -name '*.sln' | sort)
          for sln in "${solutions[@]}"; do
            echo "::group::$sln"
            dotnet test "$sln" -c Release
            echo "::endgroup::"
          done

  # docker-compose.prod.yml, the list of what's in production (tools/check-prod-pins.sh), and the release scripts'
  # fixture tests. A pull request that adds or changes a third-party pin must pin its tag's current digest; a
  # release PR (one that changes a part's version, or the build the prepare run starts) must have every digest
  # pullable.
  release-checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # attestations: read lets tools/release-state.sh verify a released version's attestations
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release scripts' fixture tests
        run: tools/tests/release-tools.sh
      # On a pull request the checkout is its merge ref, so HEAD^1 is the base and HEAD what the merge will be.
      # A PR that changes a part's version is a release PR, whatever its title, and gets the release checks:
      # the title must agree (chore(release): or chore(release)!:), and the pinned images must have been built
      # from the same service folder and release tooling as HEAD (the release job repeats both after the merge).
      - name: Check the production pins and release PRs
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          RELEASE_INPUT: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          parts='[]'
          if [ "$EVENT" = pull_request ]; then
            args+=(--base "refs/remotes/origin/$BASE_REF")
            parts="$(tools/release-plan.sh changed HEAD^1 HEAD "$TITLE" | jq -c .parts)"
          fi
          if [ "$parts" != '[]' ] || [ "$RELEASE_INPUT" = true ]; then args+=(--release); fi
          tools/check-prod-pins.sh "${args[@]}"
          # A version that is already released (a hotfix's version and pin copied back to main) was checked when
          # it was released; its images were built from the release branch, not from this merge, so the source
          # check doesn't apply. tools/release-state.sh fails on any lookup error or partial release.
          while IFS=$'\t' read -r part version; do
            state="$(tools/release-state.sh "$part" "$version")"
            echo "Release PR: $part $version ($state)"
            if [ "$state" = unreleased ]; then
              tools/release-check-source.sh "$part" "$version"
            fi
          done < <(jq -r '.[] | [.part, .version] | @tsv' <<<"$parts")

  # Every folder with a package.json under */Frontend/ is a frontend; found at run time, so adding an app needs no workflow change
  find-frontends:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: echo "apps=$(find . -path '*/Frontend/*/package.json' -not -path '*/node_modules/*' -printf '%h\n' | sed 's|^\./||' | sort | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  frontends:
    needs: find-frontends
    if: needs.find-frontends.result == 'success' && needs.find-frontends.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.find-frontends.outputs.apps) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lint (when the app has a lint script)
        run: |
          if jq -e '.scripts.lint' package.json >/dev/null; then npm run lint; else echo "No lint script"; fi

  # The images to publish, read from each service's docker-compose.yml (tools/list-images.sh). Runs on pull requests
  # too, so a Dockerfile that no Compose service builds fails the PR instead of silently never being published.
  find-images:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.find.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: find
        run: echo "images=$(tools/list-images.sh)" >> "$GITHUB_OUTPUT"

  # Publishes every image as the development version: ghcr.io/<owner>/elysium-<service>-<component>:main and
  # :main-<short sha>, with build provenance. Only on a push to main (never on pull requests, forks or manual runs),
  # and only after the boundary check, every build and every test passed, because :main is what development runs.
  # The only job allowed to write packages; everything else stays read-only.
  publish:
    needs: [changes, boundaries, dotnet, frontends, find-images]
    if: >-
      !cancelled() && !failure()
      && needs.changes.outputs.code == 'true'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.find-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # signs the provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.find-images.outputs.images) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags and the OCI labels; org.opencontainers.image.source links the package to this repository
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=main-,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.image.image }}
      # provenance: false leaves out BuildKit's unsigned attestation; the signed one comes from the next step
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.image }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # The one check main and release/** require. It runs on every change (if: always()), so a Markdown-only pull
  # request and a failed or cancelled job are both reported, and a required check can't stay "expected" forever.
  # tools/ci-gate.sh holds every job to exactly what this change calls for; on a pull request the gate then waits
  # for the Release workflow's run on the same commit (tools/ci-release-run.sh), whose dry run only does work when a
  # PR changes the release tooling. A gate can't `needs` a job of another workflow, hence the wait. Both
  # workflows start on the same event, and the gate looks the run up only after its own needs finished.
  gate:
    needs: [changes, boundaries, dotnet, release-checks, find-frontends, frontends, find-images, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # lists the Release workflow's runs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Gate fixture tests
        run: tools/tests/ci-tools.sh
      - name: Prince .env check tests
        run: tools/tests/env-check.sh
      - name: File storage redaction tests
        run: tools/tests/file-storage-entrypoint.sh
      - name: Ticket script tests
        run: tools/tests/ticket-tools.sh
      - name: Compose image-name check tests
        run: tools/tests/check-compose-images.sh
      # Real containers: the edge from Edge/ in front of two stub upstreams (about 3 minutes). Only when something besides
      # Markdown changed; the smoke against the real Prince stack (EDGE_SMOKE=1) runs at review, not here.
      - name: Edge proxy tests
        if: needs.changes.outputs.code == 'true'
        run: tools/tests/edge.sh
      - name: Every job did what this change calls for
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: tools/ci-gate.sh
      - name: The Release workflow's run on this commit succeeded
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/ci-release-run.sh "$HEAD_SHA"
