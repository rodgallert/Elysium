# The edge suite's override of Edge/timeouts.conf (#126): mounted over it for the edge suite's run only, so the upstream
# read timeout case waits 3 s, not 30. The shipped file is never replaced by this one; tools/tests/edge.sh checks the shipped
# values statically. The client header and body timeouts keep their 10 s (the suite checks them in parallel with the read timeout).
proxy_connect_timeout 1s;
proxy_send_timeout 30s;
proxy_read_timeout 3s;
client_header_timeout 10s;
client_body_timeout 10s;
