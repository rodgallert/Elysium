# Smoke-test overrides for Prince/docker-compose.yml: no fixed host ports (a running stack of the PO keeps 9001), the proxy
# published on the loopback port the test picks (the edge proxy isn't part of this test), and no edge network (it would have
# to exist outside the test's own project).
services:
  file-storage:
    ports: !override []
  reverse-proxy:
    ports: !override
      - "127.0.0.1:${COMPOSE_SMOKE_PROXY_PORT}:80"
    networks: !override
      default: {}
networks:
  elysium-edge: !reset null
