# The edge's timeouts (#75-AC3.4), the only values the edge suite replaces in its tests (#126): nginx.conf includes this file
# in the http block. The shipped values are the ones below; tools/tests/edge.sh checks them statically.

# connect to a stack: a dead address answers fast instead of after nginx's default 60 s
proxy_connect_timeout 3s;
# an upstream that accepts and never reads or answers
proxy_send_timeout 30s;
proxy_read_timeout 30s;
# a client that never finishes its headers or its body
client_header_timeout 10s;
client_body_timeout 10s;
