# The edge proxy (#75): the one process that publishes a host port. It routes by Host to each stack's entry proxy,
# which joins the external network `elysium-edge` under a per-environment alias. It runs as user 101 on port 8080,
# read-only, with its pid file and temporary files on tmpfs (the pid file goes to /tmp, the temp paths stay under
# /var/cache/nginx), so there is no `user` directive. Design: Docs/environments-design.md, section 3.
worker_processes 1;
pid /tmp/nginx.pid;
# crit: an error line of nginx quotes the request, query string included ("request: GET /x?token=..."), so only
# failures that leave nginx unable to work are logged; every request, failed ones too, has its access log line
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    default_type text/plain;
    server_tokens off;
    sendfile on;

    # Upstreams are looked up by name at request time through Docker's embedded DNS, so the edge starts with no
    # stack running and finds a stack that starts or is recreated within `valid` seconds, without a restart. ipv6=off:
    # a failing AAAA lookup can't fail a request. A failed lookup is logged as "<name> could not be resolved".
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Toward the stacks: HTTP/1.1 so a WebSocket upgrade passes (an upgrade needs 1.1; the stack's own proxy keeps its 1.0
    # toward the backends, #73), and a short connect timeout so a dead address answers fast instead of after 60 s.
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    # A request body is read in full (client_body_timeout) before the stack sees it, so a slow client holds the edge's
    # connection, not the stack's; it waits in a temporary file on the tmpfs (10 MiB at most). A response is never written
    # to a temporary file: it streams, so a large download can't fill the tmpfs.
    proxy_max_temp_file_size 0;

    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 10m;
    large_client_header_buffers 4 8k;

    # Which environment a Host belongs to. $http_host is the header as sent: the match is exact (case-insensitive)
    # and accepts only a trailing dot and the port 80, so `prince.localhost:8080`, `prince.dev.localhost.evil.com`,
    # an IP address, `localhost`, an empty Host and no Host at all stay empty and get 421. $edge_host is the
    # normalised name, which the stack sees as Host and X-Forwarded-Host.
    map $http_host $edge_host {
        default "";
        "~*^prince\.localhost\.?(:80)?$" prince.localhost;
        "~*^prince\.dev\.localhost\.?(:80)?$" prince.dev.localhost;
    }
    # 1 when the request line was read (the request has a URI) and the Host header is empty or missing; a space separates the
    # two because neither can contain one
    map "$request_uri $http_host" $edge_host_missing {
        default 0;
        "~^\S+ $" 1;
    }
    # The entry proxy of each environment (aliases on `elysium-edge`). A production name never reaches the dev proxy
    # and the other way round; the value is the whole URL, so nginx resolves the name per request.
    map $edge_host $edge_upstream {
        default "";
        prince.localhost http://prince-prod-proxy:80;
        prince.dev.localhost http://prince-dev-proxy:80;
    }

    # Only a WebSocket upgrade passes (case-insensitive, and nothing else in the value). Any other Upgrade (h2c, a list, a
    # misspelling) is dropped and the request goes out with `Connection: close`, so no stack can answer 101 and turn the
    # connection into a tunnel that skips the edge's Host check, path normalisation, headers and log.
    map $http_upgrade $edge_upgrade {
        default "";
        "~*^websocket$" websocket;
    }
    map $edge_upgrade $connection_upgrade {
        default close;
        websocket upgrade;
    }

    # The path as sent, without the query string. The log never holds the query string, the Authorization or Cookie
    # header or a body; escape=json keeps a newline or an ESC byte in a path inside its own line.
    map $request_uri $log_path {
        "~^(?<p>[^?]*)" $p;
        default "-";
    }
    map $upstream_addr $log_upstream {
        "" "-";
        default $upstream_addr;
    }
    log_format edge escape=json '{"time":"$time_iso8601","host":"$host","method":"$request_method","path":"$log_path",'
                                '"status":$status,"upstream":"$log_upstream","request_time":$request_time}';
    # The container's own health check comes from loopback and is not logged
    map $remote_addr $log_request {
        127.0.0.1 0;
        ::1 0;
        default 1;
    }
    access_log /dev/stdout edge if=$log_request;

    server {
        listen 8080 default_server;
        server_name _;
        absolute_redirect off;

        # Headers on every response, errors included. The stack's own values are hidden below so none is doubled.
        # The policy is report-only until Masquerade's UI has no inline script (Hangfire's dashboard has some).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # A Host that is not on the allow-list is refused with 421 and an empty body (`return 421 ""` would send nginx's
        # error page, so the status goes through a named location that sends nothing).
        recursive_error_pages on;
        error_page 421 =421 @empty;
        location @empty {
            return 200;
        }
        # nginx answers 400 itself to a request it can't use, and the edge keeps that status. The one exception: a request
        # whose request line was read and whose Host header is empty or missing (HTTP/1.1) has a Host that is not on the
        # allow-list, so it gets the same 421. Everything else stays 400: a malformed request line (garbage, a bad method,
        # `GET x`, an invalid or NUL percent sequence, a raw space, a path above `/`), an invalid header line after the Host
        # line, two Host headers, an over-long line. The error page is a URI, not a named location: a request rejected
        # while its request line was read has no URI yet, and nginx can't redirect it to a named location (it answers 500).
        # An invalid header line sent before the Host line leaves the Host unread, so that case answers 421.
        error_page 400 /.edge-400;
        location = /.edge-400 {
            internal;
            if ($edge_host_missing) {
                return 421;
            }
            return 400 "bad request\n";
        }

        location / {
            # A Host that is not on the allow-list is refused here, not at the server level: the server-level check would run
            # again for the error page above, and a malformed request line (no Host read yet) would answer 421 instead of 400.
            if ($edge_upstream = "") {
                return 421;
            }

            # Request paths are normalised for every service: nginx decodes and merges the path, and the rewrite makes it
            # send that path percent-encoded again, so a raw \ " < > ` | ^ reaches the stack as %5C %22 %3C %3E %60 %7C %5E
            # and an already encoded %5C stays one. (?s) lets . match an encoded newline.
            rewrite "(?s)^(.*)$" $1 break;
            proxy_pass $edge_upstream;

            # Set here, never taken from the client
            proxy_set_header Host $edge_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Host $edge_host;
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header Upgrade $edge_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Content-Security-Policy-Report-Only;
        }
    }
}
